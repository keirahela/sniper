services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    environment:
      HEADLESS: "true"
    volumes:
      - ./.local:/app/.local
    shm_size: "256mb"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
